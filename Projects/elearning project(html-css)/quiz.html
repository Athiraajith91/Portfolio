<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Module-Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="Quiz.css">

<body>
    <div class="upper-part">
        <h1 class="mainhead"> HTML Basics Quiz</h1>
    </div>

    <div class="cards">
        <h2 class="card-head">Check your understatnding</h3>
            <div class="ques-option">
                <div class="question">
                    <h3><b>1. What does HTML stand for?</b></h3>
                </div>
                <div>
                    <button class="option">HyperText Markup Language</button>
                    <button class="option">HighText Machine Language</button>
                    <button class="option">Hyper Tool Multi Language</button>
                </div>
            </div>


            <div class="ques-option">
                <div class="question">
                    <h3><b>2. Which tag is used for the largest heading?</b></h3>
                </div>
                <div>
                    <button class="option">&lt;h6&gt;</button>
                    <button class="option">&lt;h1&gt;</button>
                    <button class="option">&lt;heading&gt;</button>
                </div>
            </div>



            <div class="ques-option">
                <div class="question">
                    <h3><b>3. Which tag is used to insert an image?</b></h3>
                </div>
                <div>
                    <button class="option">&lt;img&gt;</button>
                    <button class="option">&lt;pic&gt;</button>
                    <button class="option">&lt;image&gt;</button>
                </div>
            </div>
    </div>
